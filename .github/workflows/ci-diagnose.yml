# CI 러너 이미지 진단 워크플로 (임시)
#
# 목적:
#   GitHub 신규 러너 이미지(ubuntu-24.04 / 20260804.265.1)에서 Spring 테스트 컨텍스트가
#   StackOverflowError로 붕괴하는 원인을 확정한다.
#
# 방법:
#   러너 이미지는 잡마다 무작위 배정되므로(구/신 이미지 롤아웃 중), 동일 잡을 8개 병렬로
#   돌려 양쪽 이미지를 한 번에 확보한 뒤 측정값을 대조한다.
#
# 이 워크플로는 진단 목적의 임시 파일이며, 원인 확정 후 브랜치와 함께 삭제한다.

name: CI Diagnose (temporary)

on:
  push:
    branches:
      - 'debug/**'

# 진단 워크플로는 배포/푸시 권한이 필요 없다.
permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest

    strategy:
      # 하나가 실패해도 나머지가 끝까지 돌아야 비교군이 남는다.
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6, 7, 8 ]

    steps:
      - name: 📦 코드베이스 체크아웃
        uses: actions/checkout@v4
        with:
          # spotless의 ratchetFrom("origin/develop")이 develop 참조를 요구한다.
          # 얕은 클론이면 spotlessJava 태스크 생성 자체가 실패해 테스트가 못 돈다.
          fetch-depth: 0

      - name: 🖥️ 러너 환경 측정
        id: env
        run: |
          mkdir -p diag

          # 러너 이미지 버전. 이 값으로 결과를 두 그룹으로 나눈다.
          IMAGE="${ImageVersion:-unknown}"
          if [[ "$IMAGE" == "unknown" && -f /imagegeneration/imagedata.json ]]; then
            IMAGE=$(grep -o '"[0-9]\{8\}\.[0-9.]*"' /imagegeneration/imagedata.json | head -1 | tr -d '"')
          fi
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

          {
            echo "image_version=${IMAGE}"
            echo "image_os=${ImageOS:-unknown}"
            echo "kernel=$(uname -r)"
            echo "glibc=$(ldd --version | head -1)"
            echo "ulimit_s_soft=$(ulimit -S -s)"
            echo "ulimit_s_hard=$(ulimit -H -s)"
            echo "nproc=$(nproc)"
            echo "page_size=$(getconf PAGESIZE)"
          } | tee diag/environment.txt

          free -m | tee -a diag/environment.txt

      - name: 🧑‍💻 JDK 21 Corretto 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: ☕ JVM 기본값 확인
        run: |
          java -version 2>&1 | tee diag/java-version.txt
          java -XX:+PrintFlagsFinal -version 2>/dev/null \
            | grep -iE 'ThreadStackSize|MaxHeapSize|CompilerThreadStackSize' \
            | tee diag/jvm-flags.txt

      # 핵심 측정.
      # 재귀를 끝까지 돌려 가용 스택 깊이를 프레임 수로 직접 잰다.
      # 메인 스레드(ulimit -s 지배)와 새 스레드(-Xss 지배)를 따로 재야
      # 어느 쪽이 줄었는지 구분할 수 있다.
      - name: 📏 가용 스택 깊이 측정
        run: |
          cat > StackProbe.java <<'EOF'
          public class StackProbe {
              static int depth;

              static void recurse() {
                  depth++;
                  recurse();
              }

              static int measure() {
                  depth = 0;
                  try {
                      recurse();
                  } catch (StackOverflowError expected) {
                      // 여기까지 도달한 깊이가 측정값이다.
                  }
                  return depth;
              }

              public static void main(String[] args) throws Exception {
                  System.out.println("main_thread_depth=" + measure());
                  Thread t = new Thread(() -> System.out.println("new_thread_depth=" + measure()));
                  t.start();
                  t.join();
              }
          }
          EOF

          # JIT 상태에 따라 값이 흔들리므로 3회 반복한다.
          {
            echo "--- 기본 스택 (테스트가 현재 쓰는 조건) ---"
            for i in 1 2 3; do java StackProbe.java; done
            echo "--- -Xss2m 지정 시 ---"
            for i in 1 2 3; do java -Xss2m StackProbe.java; done
          } | tee diag/stack-depth.txt

      - name: 🔑 Gradlew 실행 권한 부여
        run: chmod +x gradlew

      # 실패 재현 + 전체 스택트레이스 확보.
      # CI 콘솔은 예외 체인만 요약해 남기므로, XML 결과를 통째로 빼내야
      # LoadingCache ~ Pattern 사이의 프레임을 볼 수 있다.
      - name: 🧪 테스트 실행 (기본 스택)
        id: test-default
        continue-on-error: true
        run: |
          ./gradlew test \
            --tests "*AdminDashboardAnalyticsQueryRepositoryTest*" \
            --tests "*AdminSchoolAnalyticsQueryRepositoryTest*"

      - name: 📁 기본 스택 결과 보관
        if: always()
        run: |
          mkdir -p diag/results-default
          cp -r build/test-results/test/. diag/results-default/ 2>/dev/null || true

      # 대상 클래스 2개로 재현되지 않았고, 그 잡이 하필 나쁜 이미지라면
      # 전체 스위트로 재현을 시도한다. 좋은 이미지에서는 돌릴 이유가 없다.
      - name: 🧪 전체 스위트 (재현 폴백)
        id: test-full
        if: steps.test-default.outcome == 'success' && steps.env.outputs.image == '20260804.265.1'
        continue-on-error: true
        run: ./gradlew test

      - name: 📁 전체 스위트 결과 보관
        if: always() && steps.test-full.outcome != 'skipped'
        run: |
          mkdir -p diag/results-full
          cp -r build/test-results/test/. diag/results-full/ 2>/dev/null || true

      # -Xss 지정이 실제로 해결책인지 직접 검증한다.
      # 실측상 두 이미지의 스택 크기는 동일했으므로 근본 원인은 아닐 가능성이 크지만,
      # 여유를 늘렸을 때 증상이 가려지는지는 확인 가치가 있다.
      - name: 🧪 테스트 실행 (-Xss2m)
        id: test-xss
        continue-on-error: true
        run: |
          cat > /tmp/xss.gradle.kts <<'EOF'
          allprojects {
              tasks.withType<Test>().configureEach {
                  jvmArgs("-Xss2m")
              }
          }
          EOF
          ./gradlew test --rerun-tasks -I /tmp/xss.gradle.kts \
            --tests "*AdminDashboardAnalyticsQueryRepositoryTest*" \
            --tests "*AdminSchoolAnalyticsQueryRepositoryTest*"

      - name: 📁 -Xss2m 결과 보관
        if: always()
        run: |
          mkdir -p diag/results-xss2m
          cp -r build/test-results/test/. diag/results-xss2m/ 2>/dev/null || true

      - name: 📝 요약 출력
        if: always()
        run: |
          {
            echo "## shard ${{ matrix.shard }} — image \`${{ steps.env.outputs.image }}\`"
            echo
            echo '### 환경'
            echo '```'
            cat diag/environment.txt
            echo '```'
            echo '### JVM 플래그'
            echo '```'
            cat diag/jvm-flags.txt 2>/dev/null
            echo '```'
            echo '### 가용 스택 깊이'
            echo '```'
            cat diag/stack-depth.txt 2>/dev/null
            echo '```'
            echo '### 테스트 결과'
            echo "- 기본 스택: **${{ steps.test-default.outcome }}**"
            echo "- \`-Xss2m\`: **${{ steps.test-xss.outcome }}**"
          } >> $GITHUB_STEP_SUMMARY

      - name: 📤 진단 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 이미지 버전을 이름에 박아두면 다운로드 후 바로 그룹을 나눌 수 있다.
          name: diag-${{ matrix.shard }}-${{ steps.env.outputs.image }}
          path: diag/
          retention-days: 7
