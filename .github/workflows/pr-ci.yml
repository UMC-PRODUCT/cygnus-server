name: PR CI

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Product Team Server CI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: corretto
          cache: gradle

      - name: Validate and build boot JAR
        run: |
          chmod +x gradlew .github/scripts/check-boot-jar.sh
          ./gradlew clean spotlessCheck checkstyleMain checkstyleTest compileJava compileTestJava test bootJar
          .github/scripts/check-boot-jar.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/dockerfile
          push: false
          platforms: linux/amd64
          tags: local/umc-product-server:pr-${{ github.event.pull_request.number }}
