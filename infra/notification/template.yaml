  FcmInstallationFunctionName:
    Value: !Sub ${FcmInstallationCommandFunction}:live
  DeliveryResultQueueUrl:
    Value: !Ref DeliveryResultQueue
  NotificationAlarmTopicArn:
    Value: !Ref NotificationAlarmTopic
