  FcmFailureRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub umc-product-${Environment}-notification-fcm-failure-rate
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 5
      Threshold: 5
      TreatMissingData: notBreaching
      Metrics:
        - Id: failures
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: UMCProduct/Notification
              MetricName: DeliveryFailureCount
              Dimensions:
                - Name: service
                  Value: umc-product-notification
                - Name: Channel
                  Value: FCM
            Period: 60
            Stat: Sum
        - Id: successes
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: UMCProduct/Notification
              MetricName: DeliverySuccessCount
              Dimensions:
                - Name: service
                  Value: umc-product-notification
                - Name: Channel
                  Value: FCM
            Period: 60
            Stat: Sum
        - Id: failureRate
          Label: FCM failure rate
          Expression: IF((failures + successes) > 0, 100 * failures / (failures + successes), 0)
          ReturnData: true
      AlarmActions:
        - !Ref NotificationAlarmTopic

  SesBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub umc-product-${Environment}-notification-ses-bounce-rate
      Namespace: AWS/SES
      MetricName: Reputation.BounceRate
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0.05
      ComparisonOperator: GreaterThanThreshold
