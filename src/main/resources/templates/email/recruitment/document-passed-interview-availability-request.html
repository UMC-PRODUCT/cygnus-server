<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/recruitment/shell :: email-shell('서류 전형 합격 및 면접 가능 시간 제출 안내', ~{::email-content})}">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>서류 전형 합격 및 면접 가능 시간 제출 안내</title>
</head>
<body>
<th:block th:fragment="email-content">
    <h1 style="margin: 0 0 28px; color: #161919; font-size: 26px; font-weight: 800; line-height: 38px; letter-spacing: -0.02em; overflow-wrap: anywhere; word-break: keep-all;">
        서류 전형 합격을 안내드립니다.
    </h1>
    <p style="margin: 0 0 20px; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        안녕하세요, <span th:text="${applicantName}">지원자</span>님.
    </p>
    <p style="margin: 0 0 20px; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        서류 전형에 합격하셨습니다. UMC에 관심을 갖고 지원해 주셔서 진심으로 감사합니다.
    </p>
    <p style="margin: 0 0 20px; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        다음 전형을 위해 <span style="white-space: nowrap;">면접 가능 시간을 제출해 주세요.</span> <span style="white-space: nowrap;">아래 버튼에서</span> 가능한 시간을 알려주시면 <span style="white-space: nowrap;">확인 후</span> <span style="white-space: nowrap;">면접 일정을</span> 안내드리겠습니다.
    </p>
    <p style="margin: 0 0 28px; color: #4f5757; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        문의: <span th:text="${contactSnapshot}">문의 담당자</span>
    </p>
    <p style="margin: 0; text-align: center;">
        <a th:replace="~{email/recruitment/fragments :: cta(${actionUrl})}">면접 가능 시간 제출하기</a>
    </p>
</th:block>
</body>
</html>
