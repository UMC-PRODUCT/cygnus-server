<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>면접 일정이 확정되었습니다</title>
</head>
<body th:replace="~{email/recruitment/fragments :: email-shell(~{::email-content})}">
<th:block th:fragment="email-content">
    <h1 style="margin: 0 0 28px; color: #161919; font-size: 26px; font-weight: 800; line-height: 38px; letter-spacing: -0.02em; overflow-wrap: anywhere; word-break: keep-all;">
        면접 일정이 확정되었습니다.
    </h1>
    <p style="margin: 0 0 20px; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        안녕하세요, <span th:text="${applicantName}">지원자</span>님.
    </p>
    <p style="margin: 0 0 28px; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        아래와 같이 면접 일정을 안내드립니다. <span style="white-space: nowrap;">일정을 확인해 주세요.</span>
    </p>
    <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="width: 100%; border-collapse: collapse;">
        <tbody>
        <tr th:replace="~{email/recruitment/fragments :: data-row('면접 날짜', ${interviewDate})}"></tr>
        <tr th:replace="~{email/recruitment/fragments :: data-row('면접 시간', ${interviewTime})}"></tr>
        <tr th:replace="~{email/recruitment/fragments :: data-row('면접 장소', ${location})}"></tr>
        </tbody>
    </table>
    <p style="margin: 8px 0 0; color: #4f5757; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        문의: <span th:text="${contactSnapshot}">문의 담당자</span>
    </p>
</th:block>
</body>
</html>
