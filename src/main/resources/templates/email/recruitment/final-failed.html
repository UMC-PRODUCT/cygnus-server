<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>최종 전형 결과를 안내드립니다</title>
</head>
<body th:replace="~{email/recruitment/fragments :: email-shell(~{::email-content})}">
<th:block th:fragment="email-content">
    <h1 style="margin: 0 0 28px; color: #161919; font-size: 26px; font-weight: 800; line-height: 38px; letter-spacing: -0.02em; overflow-wrap: anywhere; word-break: keep-all;">
        최종 전형 결과를 안내드립니다.
    </h1>
    <p style="margin: 0 0 20px; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        <span th:text="${applicantName}">지원자</span>님, 최종 전형 결과를 안내드립니다.
    </p>
    <p style="margin: 0 0 20px; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        신중한 검토 끝에 이번 전형에서는 <span style="white-space: nowrap;">함께하지 못하게 되었습니다.</span>
    </p>
    <p style="margin: 0; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
        지원해 주셔서 진심으로 감사드리며, <span style="white-space: nowrap;">앞으로의 여정에</span> 좋은 기회가 <span style="white-space: nowrap;">함께하기를 응원합니다.</span>
    </p>
</th:block>
</body>
</html>
