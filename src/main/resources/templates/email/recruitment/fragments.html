<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>UMC 이메일 공통 컴포넌트</title>
</head>
<body>
<table border="0" cellpadding="0" cellspacing="0" role="presentation">
    <tbody>
    <tr th:fragment="data-row(label, value)">
        <td style="padding: 0 0 16px; overflow-wrap: anywhere; word-break: keep-all;">
            <p style="margin: 0; color: #707878; font-size: 13px; font-weight: 700; line-height: 20px; word-break: keep-all;">
                <span th:text="${label}">일정</span>
            </p>
            <p style="margin: 2px 0 0; color: #161919; font-size: 16px; font-weight: 400; line-height: 28px; overflow-wrap: anywhere; word-break: keep-all;">
                <span th:text="${value}">2026년 7월 20일</span>
            </p>
        </td>
    </tr>
    <tr>
        <td th:fragment="footer" align="center"
            style="padding: 0 0 28px; color: #707878; font-size: 12px; font-weight: 400; line-height: 18px; overflow-wrap: anywhere; word-break: keep-all;">
            <div style="height: 0.5px; line-height: 0; font-size: 0; margin: 0 0 24px; background-color: #dcdee3;">&nbsp;</div>
            <p style="margin: 0 0 5px; color: #707878; font-size: 12px; line-height: 18px;">
                본 메일은 UMC 채용 전형 안내를 위해 발송되었습니다.
            </p>
            <p style="margin: 0 0 5px; font-size: 12px; line-height: 18px;">
                <a href="https://university.neordinary.com"
                   style="display: inline-block; padding: 13px 4px; color: #4f5757; font-size: 12px; line-height: 18px; text-decoration: none;">홈페이지</a>
                <span style="color: #dcdee3;">&nbsp;|&nbsp;</span>
                <a href="https://makeus-challenge.notion.site/2b4b57f4596b80d683ecd6f15f0b0f7c?source=copy_link"
                   style="display: inline-block; padding: 13px 4px; color: #4f5757; font-size: 12px; line-height: 18px; text-decoration: none;">개인정보 처리방침</a>
                <span style="color: #dcdee3;">&nbsp;|&nbsp;</span>
                <a href="https://makeus-challenge.notion.site/2b4b57f4596b80d683ecd6f15f0b0f7c?source=copy_link"
                   style="display: inline-block; padding: 13px 4px; color: #4f5757; font-size: 12px; line-height: 18px; text-decoration: none;">서비스 이용약관</a>
            </p>
            <p style="margin: 0; color: #707878; font-size: 12px; line-height: 18px;">© 2026 University MakeUs Challenge. <span style="white-space: nowrap;">All rights reserved.</span></p>
        </td>
    </tr>
    </tbody>
</table>
<p>
    <a th:fragment="cta(url)" th:href="${url}"
       style="display: inline-block; padding: 12px 20px; border-radius: 4px; background-color: #0b6b64; color: #ffffff; font-size: 14px; font-weight: 700; line-height: 20px; text-decoration: none;">면접 가능 시간 제출하기</a>
</p>
</body>
</html>
