        - fileMetadataIds
        - mentions
        - replyTo
        - reactions
        - clientMessageId
        - createdAt
        - editedAt
        - deletedAt
      properties:
        messageId:
          $ref: "#/components/schemas/PositiveDecimalString"
        threadId:
          $ref: "#/components/schemas/PositiveDecimalString"
        senderId:
          $ref: "#/components/schemas/PositiveDecimalString"
        senderName:
          type: string
        content:
          $ref: "#/components/schemas/NullableString"
        type:
          type: string
          enum: [TEXT, IMAGE, SYSTEM]
        status:
          type: string
          enum: [SENT]
        fileMetadataIds:
          type: array
          items:
            type: string
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/MessageMention"
        replyTo:
          oneOf:
            - $ref: "#/components/schemas/MessageReply"
            - type: "null"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
        clientMessageId:
          $ref: "#/components/schemas/NullableUuid"
        createdAt:
          type: string
          format: date-time
        editedAt:
          $ref: "#/components/schemas/NullableDateTime"
        deletedAt:
          $ref: "#/components/schemas/NullableDateTime"

